stage=PROD1
quarkus.http.port=9850

session.idle.timeout.minutes=300
session.lifetime.seconds=86400

fileshare.upload-dir=/deployments/fileshare
fileshare.max-bytes=20971520

# -------------------------------------------------------------------------------
#          WEB-Security
# -------------------------------------------------------------------------------
# Wichtig: der Name des SessionCookies muss mit JSESSIONID beginnen, sonst funktioniert das im Browser irgendwie nicht.
# Au\u00DFerdem m\u00FCssen die Requests vom frontend das Attribut withCredentials: true haben (Angular - Intercepror!)
session-cookie.name=JSESSIONID
session-cookie.same-site=STRICT
session-cookie.secure=true
session-cookie.path=/fileshare

# f\u00FCr public APIs, damit ein altes JSESSIONID-Cookie nicht zu einer 401 f\u00FChrt
quarkus.http.auth.proactive=false

csrf-cookie.name=XSRF-TOKEN
csrf-cookie.same-site=STRICT
csrf-cookie.secure=true
csrf-cookie.path=/fileshare

csrf-header-name=X-XSRF-TOKEN

csrf-disabled=false

## CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://mathe-jung-alt.de

# Achtung: mod-security verbietet standardm\u00C3\u00A4\u00C3?ig PUT und DELETE.
# Daher parallel in /etc/apache2/sites-available/xxx.conf die rule 911100 f\u00C3\u00BCr profil-api entfernen,
# sonst bekommt man 403
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.methods=POST, PUT, GET, HEAD, OPTIONS, DELETE
quarkus.http.cors.headers=Content-Type,Accept,API-Version,X-Requested-With,Content-Disposition,X-XSRF-TOKEN,X-CLIENT-ID,Access-Control-Allow-Origin,Access-Control-Allow-Credentials
quarkus.http.cors.exposed-headers=Content-Type,Content-Disposition,API-Version,X-XSRF-TOKEN,X-CLIENT-ID,X-CORRELATION-ID,Access-Control-Allow-Origin
quarkus.http.cors.access-control-max-age=6H

# --------------------------------------------------------------------------------
#          vertx-http-Module- headers
# --------------------------------------------------------------------------------
## Cache-Control & Co: werden im Frontend generiert
#quarkus.http.header."Cache-Control".value=no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0
#quarkus.http.header."Pragma".value=no-cache
#quarkus.http.header."Expires".value=0
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains; preload
quarkus.http.header."Referrer-Policy".value=no-referrer
#quarkus.http.header."Permissions-Policy".value=geolocation=(), microphone=()
quarkus.http.header."Vary".value=Origin
quarkus.http.header."Server".value=Hex
quarkus.http.header."X-Powered-By".value=Ponder Stibbons

# --------------------------------------------------------------------------------
#           Authentifizierung
# --------------------------------------------------------------------------------
auth-app.url=https://mathe-jung-alt.de/authprovider/

# extra Minus in den Wert, damit sofort auffaellt, dass es nicht korrekt konfiguriert ist (gibt eine 400 vom authprovider)
public-redirect-url=https://mathe-jung-alt.de/fileshare/

# Issuer-Pr\u00FCfung (entspricht withIssuer(...))
mp.jwt.verify.issuer=heike2718/authprovider

# Public Key (PEM) ? in src/main/resources/keys/authprov_public_key.pem
mp.jwt.verify.publickey.location=keys/authprov_public_key.pem

# Optional: etwas Toleranz bei Uhrzeiten (Sekunden)
smallrye.jwt.verify.clock.skew=5

# --------------------------------------------------------------------------------
#           REST-Clients
# --------------------------------------------------------------------------------
## authprovider
quarkus.rest-client.authprovider.url=https://mathe-jung-alt.de/authprovider
quarkus.rest-client.authprovider.scope=ApplicationScoped
quarkus.rest-client.authprovider.connect-timeout=5000
quarkus.rest-client.authprovider.read-timeout=30000

## Filescanner-REST-Client
#quarkus.rest-client.filescanner.url=ueberschreiben
quarkus.rest-client.filescanner.scope=ApplicationScoped
quarkus.rest-client.filescanner.connect-timeout=5000
quarkus.rest-client.filescanner.read-timeout=30000


# diagnose bei Fehlern - mal ins payload schauen
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=5000
quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=ERROR

# --------------------------------------------------------------------------------
#           Logging
# --------------------------------------------------------------------------------
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %p (%t) clientId=%X{clientId}, correlationId=%X{correlationId}, [%c:%L] %s%e%n
quarkus.log.level=INFO

quarkus.log.file=true
quarkus.log.file.level=INFO
quarkus.log.file.path=/deployments/logs/server.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %p (%t) clientId=%X{clientId}, correlationId=%X{correlationId}, [%c:%L] %s%e%n
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd

quarkus.http.access-log.enabled=true
quarkus.http.record-request-start-time=true
quarkus.http.access-log.pattern=%h %l %u [%t] "%r" %s %b "%{i,Referer}" "%{i,User-Agent}" %D "%{i,X-CLIENT-ID}" "%{i,X-CORRELATION-ID}"
quarkus.http.access-log.log-to-file=false
quarkus.http.access-log.base-file-name=access
quarkus.http.access-log.log-directory=/deployments/logs
quarkus.http.access-log.rotate=true

#https://github.com/quarkusio/quarkus/pull/39267
quarkus.http.access-log.consolidate-rerouted-requests=true

quarkus.log.category."com.arjuna.ats.arjuna".level=ERROR
quarkus.log.category."com.arjuna.ats.jta".level=ERROR
quarkus.log.category."com.arj.ats.arjuna".level=ERROR



# --------------------------------------------------------------------------------
#           OpenAPI
# --------------------------------------------------------------------------------
quarkus.smallrye-openapi.path=/swagger
quarkus.swagger-ui.always-include=false
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.info-version=${pom.version}
quarkus.smallrye-openapi.store-schema-directory=src/main/resources/META-INF/openapi
quarkus.smallrye-openapi.info-title=fileshare
quarkus.smallrye-openapi.info-description=Fileshare-API
quarkus.smallrye-openapi.info-contact-email=info@egladil.de
quarkus.smallrye-openapi.info-contact-name=Heike Winkelvoss
quarkus.smallrye-openapi.info-contact-url=https://mathe-jung-alt.de
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0.html


# --------------------------------------------------------------------------------
#           devservices
# --------------------------------------------------------------------------------
quarkus.devservices.enabled=false
quarkus.datasource.devservices.enabled=false


